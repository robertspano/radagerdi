<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ráðagerði · Admin</title>
<style>
  :root{--red:#ff3132;--green:#629F67;--ink:#1a1b1f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(180deg,#6ea873 0%,#5c9061 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .card{background:#fff;width:min(380px,100%);border-radius:24px;box-shadow:0 24px 60px rgba(30,50,35,.28);
    padding:44px 38px 34px;text-align:center}
  .logo{height:66px;width:auto;margin:0 auto 20px;display:block}
  .sub{color:#9aa0a4;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 30px}
  form{display:flex;flex-direction:column;gap:12px}
  input{width:100%;border:1.5px solid #e4e7e9;border-radius:14px;padding:15px 16px;font-size:15px;outline:none;
    text-align:center;transition:.15s;background:#fafbfb}
  input::placeholder{color:#b6bbbf}
  input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(98,159,103,.12)}
  button{width:100%;background:var(--green);color:#fff;border:none;border-radius:14px;padding:15px;
    font-size:15px;font-weight:700;cursor:pointer;transition:.15s;margin-top:4px}
  button:hover{background:#55915b}
  button:disabled{opacity:.55;cursor:default}
  .err{color:var(--red);font-size:13px;min-height:17px;font-weight:600}
</style>
</head>
<body>
  <form class="card" id="f">
    <img class="logo" src="/assets/6345d37b6a29219af60d57f4_Radagerdi-logo-1.svg" alt="Ráðagerði">
    <p class="sub">Efnisstjórnun</p>
    <div id="step-email" hidden>
      <input id="em" type="email" autocomplete="email" placeholder="Netfangið þitt" style="margin-bottom:12px">
      <button id="go-em" type="button">Senda mér tengil</button>
      <p class="hint">Þú færð póst með tengli sem opnar ritilinn. Ekkert lykilorð.</p>
    </div>
    <div id="step-sent" hidden>
      <p class="sent">📬</p>
      <p id="sentto"></p>
      <p class="hint">Opnaðu póstinn og smelltu á tengilinn. Hann gildir í 15 mínútur.<br>
        <a href="#" id="again">Senda aftur</a></p>
    </div>
    <div id="step-off" hidden>
      <p class="hint">Innskráning er ekki uppsett á þessum vef. Hafðu samband við Róbert.</p>
    </div>
    <div class="err" id="err"></div>
  </form>
<style>.sent{font-size:34px;margin:6px 0 2px}.hint{color:#9aa0a4;font-size:12.5px;margin:2px 0 12px}.hint a{color:#629F67;font-weight:600;text-decoration:none}</style>
<script>
  const params = new URLSearchParams(location.search);
  // Aðeins slóðir á þessum vef: annars gæti smíðaður hlekkur (?next=https://… eða ?next=javascript:…)
  // sent nýinnskráðan eiganda annað eða keyrt skriftu í nafni hans.
  const safeNext = (v) => {
    if (!v || v[0] !== '/' || v[1] === '/' || v[1] === '\\') return null;
    try { return new URL(v, location.origin).origin === location.origin ? v : null; } catch (e) { return null; }
  };
  const next = safeNext(params.get('next')) || '/?cms=1';
  fetch('/api/session').then(r=>r.json()).then(s=>{ if(s.authed) location.replace(next); });
  const $=id=>document.getElementById(id), err=$('err');
  const show=(id)=>{ ['step-email','step-sent','step-off'].forEach(x=>$(x).hidden=(x!==id)); err.textContent=''; };
  const jfetch=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  let email='';

  fetch('/api/login-mode').then(r=>r.json()).then(m=>{
    if(m.mode==='email'){ show('step-email'); $('em').focus(); }
    else show('step-off');
  }).catch(()=>{ show('step-email'); $('em').focus(); });

  async function sendLink(){
    email=$('em').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Sláðu inn gilt netfang'; return; }
    $('go-em').disabled=true; $('go-em').textContent='Sendi…';
    try{
      const j=await jfetch('/api/login-link',{email,next});
      if(j.ok){ $('sentto').textContent='Tengill var sendur á '+email; show('step-sent'); }
      else err.textContent=j.error||'Villa';
    }catch(e){ err.textContent='Villa við tengingu'; }
    $('go-em').disabled=false; $('go-em').textContent='Senda mér tengil';
  }
  $('go-em').onclick=sendLink;
  $('again').onclick=(e)=>{ e.preventDefault(); show('step-email'); $('em').focus(); };
  $('em').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); sendLink(); } });
  $('f').addEventListener('submit',e=>{ e.preventDefault(); sendLink(); });
</script>
</body>
</html>
