<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ráðagerði · Admin</title>
<style>
  :root{--red:#FF3031;--green:#629F67;--ink:#1a1b1f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(180deg,#6ea873 0%,#5c9061 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .card{background:#fff;width:min(380px,100%);border-radius:24px;box-shadow:0 24px 60px rgba(30,50,35,.28);
    padding:44px 38px 34px;text-align:center}
  .logo{height:66px;width:auto;margin:0 auto 20px;display:block}
  .sub{color:#9aa0a4;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 30px}
  form{display:flex;flex-direction:column;gap:12px}
  input{width:100%;border:1.5px solid #e4e7e9;border-radius:14px;padding:15px 16px;font-size:15px;outline:none;
    text-align:center;transition:.15s;background:#fafbfb}
  input::placeholder{color:#b6bbbf}
  input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(98,159,103,.12)}
  button{width:100%;background:var(--green);color:#fff;border:none;border-radius:14px;padding:15px;
    font-size:15px;font-weight:700;cursor:pointer;transition:.15s;margin-top:4px}
  button:hover{background:#55915b}
  button:disabled{opacity:.55;cursor:default}
  .err{color:var(--red);font-size:13px;min-height:17px;font-weight:600}
</style>
</head>
<body>
  <form class="card" id="f">
    <img class="logo" src="/assets/6345d37b6a29219af60d57f4_Radagerdi-logo-1.svg" alt="Ráðagerði">
    <p class="sub">Efnisstjórnun</p>
    <div id="step-email" hidden>
      <input id="em" type="email" autocomplete="email" placeholder="Netfangið þitt" style="margin-bottom:12px">
      <button id="go-em" type="button">Fá kóða í tölvupósti</button>
    </div>
    <div id="step-code" hidden>
      <p class="hint" id="sentto"></p>
      <input id="cd" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 stafa kóði" style="margin-bottom:12px;letter-spacing:.3em;font-size:20px">
      <button id="go-cd" type="button">Staðfesta</button>
      <p class="hint"><a href="#" id="again">Senda kóðann aftur</a></p>
    </div>
    <div id="step-pw" hidden>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Lykilorð" style="margin-bottom:12px">
      <button id="go" type="submit">Skrá inn</button>
    </div>
    <div class="err" id="err"></div>
  </form>
<style>.hint{color:#9aa0a4;font-size:12.5px;margin:2px 0 12px}.hint a{color:#629F67;font-weight:600;text-decoration:none}</style>
<script>
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/index.html?cms=1';
  fetch('/api/session').then(r=>r.json()).then(s=>{ if(s.authed) location.replace(next); });
  const $=id=>document.getElementById(id), err=$('err');
  const show=(id)=>{ ['step-email','step-code','step-pw'].forEach(x=>$(x).hidden=(x!==id)); err.textContent=''; };
  const jfetch=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  let email='';

  fetch('/api/login-mode').then(r=>r.json()).then(m=>{
    if(m.mode==='email'){ show('step-email'); $('em').focus(); }
    else { show('step-pw'); $('pw').focus(); }
  }).catch(()=>{ show('step-pw'); });

  async function requestCode(){
    email=$('em').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Sláðu inn gilt netfang'; return; }
    $('go-em').disabled=true; $('go-em').textContent='Sendi kóða…';
    try{
      const j=await jfetch('/api/login-code',{email});
      if(j.ok){ $('sentto').textContent='Kóði var sendur á '+email+' (ef það hefur aðgang)'; show('step-code'); $('cd').focus(); }
      else err.textContent=j.error||'Villa';
    }catch(e){ err.textContent='Villa við tengingu'; }
    $('go-em').disabled=false; $('go-em').textContent='Fá kóða í tölvupósti';
  }
  async function verifyCode(){
    const code=$('cd').value.trim();
    if(code.length<6){ err.textContent='Sláðu inn 6 stafa kóðann'; return; }
    $('go-cd').disabled=true; $('go-cd').textContent='Staðfesti…';
    try{
      const j=await jfetch('/api/login-verify',{email,code});
      if(j.ok){ location.replace(next); return; }
      err.textContent=j.error||'Rangur kóði';
    }catch(e){ err.textContent='Villa við tengingu'; }
    $('go-cd').disabled=false; $('go-cd').textContent='Staðfesta';
  }
  $('go-em').onclick=requestCode;
  $('go-cd').onclick=verifyCode;
  $('again').onclick=(e)=>{ e.preventDefault(); $('cd').value=''; requestCode(); };
  $('em').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); requestCode(); } });
  $('cd').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); verifyCode(); } });
  $('cd').addEventListener('input',()=>{ if($('cd').value.trim().length===6) verifyCode(); });

  $('f').addEventListener('submit', async (e)=>{
    e.preventDefault(); if($('step-pw').hidden) return;
    err.textContent=''; $('go').disabled=true; $('go').textContent='Skrái inn…';
    try{
      const j=await jfetch('/api/login',{password:$('pw').value});
      if(j.ok){ location.replace(next); }
      else { err.textContent=j.error||'Rangt lykilorð'; $('go').disabled=false; $('go').textContent='Skrá inn'; }
    }catch(ex){ err.textContent='Villa við tengingu'; $('go').disabled=false; $('go').textContent='Skrá inn'; }
  });
</script>
</body>
</html>
